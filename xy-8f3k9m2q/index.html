  function copyText(text, btnText) {
    let success = false;

      navigator.clipboard.writeText(text).then(() => {
        showToast(btnText ? "已复制: " + btnText : "已复制到剪贴板");
      }).catch(() => {
        fallbackCopy(text, btnText);
      });
    } else {
      fallbackCopy(text, btnText);
    }
  }

  function fallbackCopy(text, btnText) {
    const ta = document.getElementById("clipboard-textarea");
    ta.value = text;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
      const ok = document.execCommand("copy");
      if (ok) showToast(btnText ? "已复制: " + btnText : "已复制到剪贴板");
      else alert("复制失败，请长按文本手动复制");
