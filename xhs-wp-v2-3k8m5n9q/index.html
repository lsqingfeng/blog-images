<style>
  :root { --bg:#F5F7FA; --card:#FFFFFF; --ink:#161A22; --muted:#647084; --line:#E3E8F0; --accent:#E85D3F; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:44px; }
  header { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 14px 10px; }
  .head-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  h1 { margin:0; font-size:17px; font-weight:700; }
  .mode-pill { font-size:11px; color:var(--muted); background:#EEF2F7; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tab-btn { border:1px solid var(--line); background:#F8FAFC; color:var(--ink); border-radius:12px; padding:9px 4px; font-size:12px; font-weight:700; cursor:pointer; }
  .tab-btn.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { max-width:680px; margin:0 auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
  .panel { display:none; flex-direction:column; gap:12px; }
  .panel.active { display:flex; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .card-title { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:11px; color:#334155; background:#EEF2F7; padding:3px 8px; border-radius:999px; font-weight:600; }
  .img-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .img-card { background:#F8FAFC; border:1px solid var(--line); border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .img-head { display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--muted); }
  .img-card img { width:100%; border-radius:8px; display:block; -webkit-touch-callout:default; }
  .mini-btn { flex-shrink:0; text-decoration:none; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chip { border:1px solid var(--line); background:#F8FAFC; color:var(--ink); padding:5px 10px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .box { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px; font-family:inherit; font-size:13px; line-height:1.55; color:var(--ink); background:#FAFBFC; resize:none; }
  .box.short { min-height:60px; }
  .box.tall { min-height:220px; }
  .lbl { display:block; font-size:12px; color:var(--muted); font-weight:600; margin:8px 0 4px; }
  .big-btn { width:100%; margin-top:8px; border:0; border-radius:12px; padding:12px 10px; font-size:14px; font-weight:700; cursor:pointer; background:var(--ink); color:#fff; }
  .big-btn.orange { background:var(--accent); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(22,26,34,0.92); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; opacity:0; transition:opacity .18s; pointer-events:none; z-index:99; white-space:nowrap; }
  .toast.show { opacity:1; }
</style>

做这版的时候特意避开了满屏乱闪的花纹，把中上方承接时钟的区域留成干净平滑的镜面过渡。换成 iOS 大号拉伸时间数字以后，数字下缘和边缘流银刚好接上，放在木桌面上亮屏看时间特别顺眼。

一共整理了 4 张不同材质的同系列原图：亮银液态水银搭配黑曜石黑金，还有冰封水晶棱边和哑光褶皱钛箔。全部按照全面屏 9:19.5 比例单独修过边缘，图面干干净净没有假时间和水印。

4 张高清无字原图打包放在小店里了，懒得自己裁图的可以直接去左下角看看。

<div id="toast" class="toast">已复制</div>
<script>
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function useTitle(btn) {
  btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('shop-title').value = btn.dataset.title;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function legacyCopy(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}
function copyPlain(txt, label) {
  if (legacyCopy(txt)) { toast('已复制' + label); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast('已复制' + label), () => toast('复制失败，请长按文本框全选'));
  } else {
    toast('复制失败，请长按文本框全选');
  }
}
function copyField(id, label) { copyPlain(document.getElementById(id).value, label); }
</script>
